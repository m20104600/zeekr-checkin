# ══════════════════════════════════════════════════════════════════════
# 极氪签到 · Egern 配置片段
# 脚本地址：<你的脚本地址前缀>/zeekr.js（Egern 用 zeekr.egern.js）
#
# 两种用法（任选）：
#   A. 自动抓 Token（推荐）：用下面的抓取规则，打开极氪 App 点一下，
#      存储键名 zeekr_val，值是含 authorization 字段的 JSON —— 与常见极氪脚本互通；
#      青龙那边也可以直接把这份 JSON 塞进环境变量 zeekr_val / ZEEKR_VAL。
#      Token 自动存进客户端（键名 zeekr_val），定时任务不用填 Token。
#   B. 手动填 Token：把每条 cron 参数里的 <把这里换成你的Bearer Token> 替换成真 Token。
#      QX 的 # 参数不会发到服务器，Loon/Stash/Egern 的 argument/env 也只在本机。
#      ⚠️ 千万别把 Token 写进公开托管的脚本文件里！
#
# 场次安排（与 Hermes 里那套 systemd 三场一致，脚本默认「快跑 + 10 分钟后补领」）：
#   00:01 全流程    00:10 只领取（补延迟入账的碎片/能量球）
#   08:10 全流程    08:20 只领取
#   21:30 全流程    21:40 只领取
# 客户端超时可以放宽的话，可以只用 3 条 cron + POLL=1（脚本自己轮询到领完，
# 单次约 3~5 分钟，需要 timeout ≥ 420）。
# ══════════════════════════════════════════════════════════════════════

scriptings:
  # 自动抓 Token（HTTP 请求脚本，需要 Egern 的 HTTPS 解密/MitM 开启）
  - http_request:
      name: "极氪抓Token"
      # 也可放宽为 "^https://api-gw-toc\\.zeekrlife\\.com/"
      match: "^https://api-gw-toc\\.zeekrlife\\.com/zeekrlife-app-user/v\d/user/info/query"
      script_url: "<你的脚本地址前缀>/zeekr.egern.js"
      timeout: 20

  # 凌晨场
  - schedule:
      name: "极氪签到·凌晨场"
      cron: "1 0 * * *"
      script_url: "<你的脚本地址前缀>/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_TOKEN: "<把这里换成你的Bearer Token>"
        ZEEKR_MODE: "all"
        ZEEKR_TAG: "凌晨场"
  - schedule:
      name: "极氪签到·凌晨补领"
      cron: "10 0 * * *"
      script_url: "<你的脚本地址前缀>/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "claim"
        ZEEKR_TAG: "凌晨场·补领"

  # 早间场
  - schedule:
      name: "极氪签到·早间场"
      cron: "10 8 * * *"
      script_url: "<你的脚本地址前缀>/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_TOKEN: "<把这里换成你的Bearer Token>"
        ZEEKR_MODE: "all"
        ZEEKR_TAG: "早间场"
  - schedule:
      name: "极氪签到·早间补领"
      cron: "20 8 * * *"
      script_url: "<你的脚本地址前缀>/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "claim"
        ZEEKR_TAG: "早间场·补领"

  # 晚间场
  - schedule:
      name: "极氪签到·晚间场"
      cron: "30 21 * * *"
      script_url: "<你的脚本地址前缀>/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_TOKEN: "<把这里换成你的Bearer Token>"
        ZEEKR_MODE: "all"
        ZEEKR_TAG: "晚间场"
  - schedule:
      name: "极氪签到·晚间补领"
      cron: "40 21 * * *"
      script_url: "<你的脚本地址前缀>/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "claim"
        ZEEKR_TAG: "晚间场·补领"

# 说明：
# * Egern 的 schedule 默认超时只有 10 秒、最大 600 秒 —— 务必显式写 timeout。
# * 想一次跑完（等奖励入账后领光）：env 里加 ZEEKR_POLL: "1"，timeout 设 600。
# * 抓取脚本要用 zeekr.egern.js（Egern 的脚本是 ES Module，和别家不同一个文件）。

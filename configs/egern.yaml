# ══════════════════════════════════════════════════════════════════════
# 极氪签到 · Egern **模块** 
#
# 添加方式（推荐模块方式，别直接整段贴到别处）：
#   Egern → 模块 → 右上角 + → URL 填：
#     https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/configs/egern.yaml
#   或把下面的 mitm / scriptings 两段复制进你的 Profile.yaml。
#
# 注意：Egern 的模块文件需要 name/description 这类元数据；YAML 里正则必须用
# **单引号**（双引号里 \d 是非法转义，会直接报「发生错误」——之前就是这个报错）。
#
# Token：默认走「打开极氪 App 自动抓取」（第一个 http_request 规则，需开 MITM）；
#        抓到的 Token 存在客户端持久化存储（键 zeekr_val），定时任务自动读，
#        **不需要**填模块设置里的「极氪 Token」栏（iOS 不允许脚本回写模块设置页）。
#
# 抓取开关：模块设置里的「抓取 Token」——
#        开（默认）= 打开极氪 App 就抓取并存起来，Token 变了立刻弹一条通知，
#                   没变则 10 分钟内最多弹一条（等于每次开 App 有一条确认）；
#        关 = 完全不抓取、不写存储、不弹任何通知（含「抓取调试」）。
#        改完开关把 Egern 的 VPN 开关断开重连一次，让模块参数重新加载。
#
# 抓到后想把这行 Token 放进模块设置里那栏：**点一下抓取通知即可复制到剪贴板**，
# 再粘进「极氪 Token」栏即可（脚本自己没有权限写那一栏）。
#
# 场次：00:01 全流程 → 00:10 只领取；08:10 → 08:20；21:30 → 21:40。
# 想一次跑完（约 3~5 分钟）就在 env 里加 ZEEKR_POLL: "1" 并把 timeout 提到 600。
# ══════════════════════════════════════════════════════════════════════
name: "极氪签到"
description: "极氪 App 每日自动签到 / 步数 / 阅读文章 / 每周点赞 / 领取碎片·能量球·极值"
author: "m20104600"
homepage: "https://github.com/m20104600/zeekr-checkin"
icon: "car.fill"

env_schema:
  ZEEKR_TOKEN:
    name: "极氪 Token"
    description: "可留空：开着 MITM + 打开「抓取 Token」开关，打开一次极氪 App 就会自动抓取并存起来（用不到这一栏）"
  ZEEKR_CAPTURE:
    name: "抓取 Token"
    description: "开 = 打开极氪 App 就抓取 Token 并存进持久化存储（抓到会弹一条通知）；关 = 不抓取、不写存储、不弹任何通知"
    options: ["true", "false"]
    default_value: "true"
  ZEEKR_CAPDEBUG:
    name: "抓取调试"
    description: "打开后，每条命中的抓取请求都会弹通知（列出命中的 URL 和实际收到的头名），排查完记得关掉"
    options: ["false", "true"]

# 需要 MITM 才能抓到 HTTPS 请求里的 Token（启用模块后会合并进主配置）
mitm:
  hostnames:
    - "api-gw-toc.zeekrlife.com"

scriptings:
  # ① 自动抓 Token（HTTP 请求脚本）
  - http_request:
      name: "极氪抓Token"
      # 默认匹配整个 api-gw-toc 域名（App 任何一条请求都会带 Authorization，最稳）
      match: '^https://api-gw-toc\.zeekrlife\.com/'
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.egern.js"
      timeout: 20
      # 窄版（开销更小；新版 App 不一定发这个请求）：'^https://api-gw-toc\.zeekrlife\.com/zeekrlife-app-user/v\d/user/info/query'

  # ①b 兜底：万一请求阶段不触发，用响应阶段再抓一次（参考脚本 wf021325/qx 用的就是响应阶段；
  #      只匹配「用户信息」接口，开销很小；同一个 Token 不会重复通知）
  - http_response:
      name: "极氪抓Token(响应阶段兜底)"
      match: '^https://api-gw-toc\.zeekrlife\.com/'
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.egern.js"
      timeout: 20

  # 手动自检：在 Egern「脚本」里点一下就跑 —— 能跑到「本次领取」说明抓存的 Token 有效
  - generic:
      name: "极氪Token自检（手动跑一次）"
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "claim"
        ZEEKR_TAG: "自检"

  # ② 三场定时 + 每场 10 分钟后的补领
  - schedule:
      name: "极氪签到·凌晨场"
      cron: "1 0 * * *"
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "all"
        ZEEKR_TAG: "凌晨场"
  - schedule:
      name: "极氪签到·凌晨补领"
      cron: "10 0 * * *"
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "claim"
        ZEEKR_TAG: "凌晨场·补领"
  - schedule:
      name: "极氪签到·早间场"
      cron: "10 8 * * *"
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "all"
        ZEEKR_TAG: "早间场"
  - schedule:
      name: "极氪签到·早间补领"
      cron: "20 8 * * *"
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "claim"
        ZEEKR_TAG: "早间场·补领"
  - schedule:
      name: "极氪签到·晚间场"
      cron: "30 21 * * *"
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "all"
        ZEEKR_TAG: "晚间场"
  - schedule:
      name: "极氪签到·晚间补领"
      cron: "40 21 * * *"
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.egern.js"
      timeout: 120
      env:
        ZEEKR_MODE: "claim"
        ZEEKR_TAG: "晚间场·补领"

# ══════════════════════════════════════════════════════════════════════
# 极氪抓 Token · 最小测试模块（排查专用）
#
# 用途：**只做一件事** —— 确认 Egern 到底有没有把抓取脚本跑起来、请求里有没有
#       Authorization 头。它故意做得极简：
#         · 没有任何模块参数（env_schema）—— 用来验证「参数」是不是元凶
#         · 只有一条 http_request 规则 + mitm，没有定时任务、没有自检脚本
#         · 打开 CAPDEBUG，**每命中一条请求都会弹通知**（所以一定会看到东西）
#         · 脚本地址写死了 commit（不是 main）—— 这样 Egern 一定去重新下载，
#           不会命中它 24 小时的脚本缓存（这次排查的坑就在缓存上）
#
# 用法：
#   1. Egern → 模块 → 先把「极氪签到」那个模块**关掉（禁用）**，避免干扰
#   2. 右上角 + → URL 填：
#        https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/configs/egern-min.yaml
#   3. 确认 MITM 已开、CA 证书已信任（模块里已带 mitm 域名）
#   4. 打开极氪 App，随便点几下
#
# 看到什么 → 说明什么：
#   ✅ 收到「🔍 极氪抓取调试（命中一条请求）」且「带 Authorization ✓」
#      → 抓取链路是好的，问题在**模块参数/旧缓存**，按 README 重加主模块即可
#   ⚠️ 收到调试通知但「没有 Authorization ✗」
#      → 规则命中了但没有 Authorization 头，把命中的路径截图给我，改窄/改宽匹配
#   ❌ 什么通知都没有
#      → 脚本压根没被执行：先确认 MITM 开关 + CA 证书 + 模块是否真的启用；
#        再看 Egern 的日志里有没有这条脚本的报错
#
# 排查完把本模块删掉/禁用，然后重新添加正式模块：
#   https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/configs/egern.yaml
# ══════════════════════════════════════════════════════════════════════
name: "极氪抓Token·最小测试"
description: "只抓 Token 的最小测试模块（含抓取调试通知），用于排查 Egern 抓不到 Token 的问题"
author: "m20104600"
homepage: "https://github.com/m20104600/zeekr-checkin"

mitm:
  hostnames:
    - "api-gw-toc.zeekrlife.com"

scriptings:
  # 请求阶段：命中每条 api-gw-toc 请求都会跑，CAPDEBUG 打开 → 每条都弹通知
  - http_request:
      name: "极氪抓Token·最小测试"
      match: '^https://api-gw-toc\.zeekrlife\.com/'
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/968425f405b4390bfcce7d6864eb56832a146e28/dist/zeekr.egern.js"
      update_interval: 600
      timeout: 20
      env:
        ZEEKR_CAPDEBUG: "false"   # 改 true 会每条命中都弹通知（几百条都可能），排查完记得关
        ZEEKR_CAPSHOW: "true"

  # 响应阶段兜底（有些路径请求阶段拿不到头，响应阶段再试一次）
  - http_response:
      name: "极氪抓Token·响应兜底"
      match: '^https://api-gw-toc\.zeekrlife\.com/'
      script_url: "https://raw.githubusercontent.com/m20104600/zeekr-checkin/968425f405b4390bfcce7d6864eb56832a146e28/dist/zeekr.egern.js"
      update_interval: 600
      timeout: 20
      env:
        ZEEKR_CAPDEBUG: "false"   # 改 true 会每条命中都弹通知（几百条都可能），排查完记得关
        ZEEKR_CAPSHOW: "true"

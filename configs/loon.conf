# ══════════════════════════════════════════════════════════════════════
# 极氪签到 · Loon 配置片段
# 脚本地址：<你的脚本地址前缀>/zeekr.js（Egern 用 zeekr.egern.js）
#
# 两种用法（任选）：
#   A. 自动抓 Token（推荐）：用下面的抓取规则，打开极氪 App 点一下，
#      存储键名 zeekr_val，值是含 authorization 字段的 JSON —— 与常见极氪脚本互通；
#      青龙那边也可以直接把这份 JSON 塞进环境变量 zeekr_val / ZEEKR_VAL。
#      Token 自动存进客户端（键名 zeekr_val），定时任务不用填 Token。
#   B. 手动填 Token：把每条 cron 参数里的 <把这里换成你的Bearer Token> 替换成真 Token。
#      QX 的 # 参数不会发到服务器，Loon/Stash/Egern 的 argument/env 也只在本机。
#      ⚠️ 千万别把 Token 写进公开托管的脚本文件里！
#
# 场次安排（与 Hermes 里那套 systemd 三场一致，脚本默认「快跑 + 10 分钟后补领」）：
#   00:01 全流程    00:10 只领取（补延迟入账的碎片/能量球）
#   08:10 全流程    08:20 只领取
#   21:30 全流程    21:40 只领取
# 客户端超时可以放宽的话，可以只用 3 条 cron + POLL=1（脚本自己轮询到领完，
# 单次约 3~5 分钟，需要 timeout ≥ 420）。
# ══════════════════════════════════════════════════════════════════════

# ── Loon 3.5.1(983) 及以后的新语法 ──
[Script]
# 自动抓 Token（打开极氪 App 时触发一次）
# 匹配 App 必定会发的那个接口（与常见极氪脚本一致）；抓不到就把正则放宽成 /^https:\/\/api-gw-toc\.zeekrlife\.com\//
http-request if ${url} ~= /^https:\/\/api-gw-toc\.zeekrlife\.com\/zeekrlife-app-user/v\d/user/info/query/ then script("<你的脚本地址前缀>/zeekr.js") with tag="极氪抓Token", timeout=20

# 凌晨场（timeout 60 秒足够快跑；改成 POLL=1 时请设 timeout=600）
cron "1 0 * * *" then script("<你的脚本地址前缀>/zeekr.js", "ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=凌晨场") with tag="极氪签到·凌晨场", timeout=60
cron "10 0 * * *" then script("<你的脚本地址前缀>/zeekr.js", "MODE=claim&TAG=凌晨场·补领") with tag="极氪签到·凌晨补领", timeout=60
# 早间场
cron "10 8 * * *" then script("<你的脚本地址前缀>/zeekr.js", "ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=早间场") with tag="极氪签到·早间场", timeout=60
cron "20 8 * * *" then script("<你的脚本地址前缀>/zeekr.js", "MODE=claim&TAG=早间场·补领") with tag="极氪签到·早间补领", timeout=60
# 晚间场
cron "30 21 * * *" then script("<你的脚本地址前缀>/zeekr.js", "ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=晚间场") with tag="极氪签到·晚间场", timeout=60
cron "40 21 * * *" then script("<你的脚本地址前缀>/zeekr.js", "MODE=claim&TAG=晚间场·补领") with tag="极氪签到·晚间补领", timeout=60

[Mitm]
hostname = api-gw-toc.zeekrlife.com

# ── 旧语法（Loon 3.5.1 (982) 及以前）等价写法，二选一 ──
# [Script]
# http-request ^https:\/\/api-gw-toc\.zeekrlife\.com\/ script-path=<你的脚本地址前缀>/zeekr.js, tag=极氪抓Token, timeout=20, enable=true
# cron "1 0 * * *" script-path=<你的脚本地址前缀>/zeekr.js, tag=极氪签到·凌晨场, timeout=60, argument="ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=凌晨场", enable=true
# cron "10 0 * * *" script-path=<你的脚本地址前缀>/zeekr.js, tag=极氪签到·凌晨补领, timeout=60, argument="MODE=claim&TAG=凌晨场·补领", enable=true
# cron "10 8 * * *" script-path=<你的脚本地址前缀>/zeekr.js, tag=极氪签到·早间场, timeout=60, argument="ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=早间场", enable=true
# cron "30 21 * * *" script-path=<你的脚本地址前缀>/zeekr.js, tag=极氪签到·晚间场, timeout=60, argument="ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=晚间场", enable=true

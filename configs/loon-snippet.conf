# ══════════════════════════════════════════════════════════════════════
# 极氪签到 · Loon 配置片段（想合并进自己的 .conf 时用；手机上装插件请用 loon.plugin）
# 脚本地址：https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js   （Egern 用 zeekr.egern.js）
# 国内更快的镜像：https://cdn.jsdelivr.net/gh/m20104600/zeekr-checkin@main/dist
#
# 两种拿 Token 的方式（任选）：
#   A. 自动抓（推荐）：配好下面的抓取规则，开启 MITM（信任 CA）后打开极氪 App 点一下，
#      Token 自动存进客户端（键名 zeekr_val），并弹一条通知（通知里带完整 Token，
#      青龙那种抓不了的平台复制过去即可）。定时任务不用填 Token。
#   B. 手动填：把参数里的 <把这里换成你的Bearer Token> 换成真 Token。
#      ⚠️ 千万别把 Token 写进公开托管的脚本文件里（本仓库里只有占位符）。
#
# 场次安排（与服务器版 systemd 三场一致；默认「快跑 + 10 分钟后补领」）：
#   00:01 全流程    00:10 只领取（补延迟入账的碎片/能量球）
#   08:10 全流程    08:20 只领取
#   21:30 全流程    21:40 只领取
# 客户端超时能放宽的话，也可以只留 3 条 + POLL=1（脚本自己轮询到领完，约 3~5 分钟）。
# ══════════════════════════════════════════════════════════════════════

[Script]
# 自动抓 Token
http-request if ${url} ~= /^https:\/\/api-gw-toc\.zeekrlife\.com\/zeekrlife-app-user/v\d/user/info/query/ then script("https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js") with tag="极氪抓Token", timeout=20
# 三场 + 补领（argument 直接写字面串）
cron "1 0 * * *" then script("https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js", "ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=凌晨场") with tag="极氪签到·凌晨场", timeout=60
cron "10 0 * * *" then script("https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js", "MODE=claim&TAG=凌晨场·补领") with tag="极氪签到·凌晨补领", timeout=60
cron "10 8 * * *" then script("https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js", "ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=早间场") with tag="极氪签到·早间场", timeout=60
cron "20 8 * * *" then script("https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js", "MODE=claim&TAG=早间场·补领") with tag="极氪签到·早间补领", timeout=60
cron "30 21 * * *" then script("https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js", "ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=晚间场") with tag="极氪签到·晚间场", timeout=60
cron "40 21 * * *" then script("https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js", "MODE=claim&TAG=晚间场·补领") with tag="极氪签到·晚间补领", timeout=60

[Mitm]
hostname = api-gw-toc.zeekrlife.com

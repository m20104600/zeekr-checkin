# ══════════════════════════════════════════════════════════════════════
# 极氪签到 · Quantumult X 配置片段
# 脚本地址：https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js（Egern 用 zeekr.egern.js）
#          国内更快的镜像（jsDelivr）：https://cdn.jsdelivr.net/gh/m20104600/zeekr-checkin@main/dist
#
# 两种用法（任选）：
#   A. 自动抓 Token（推荐）：用下面的抓取规则，打开极氪 App 点一下，
#      存储键名 zeekr_val，值是含 authorization 字段的 JSON —— 与常见极氪脚本互通；
#      青龙那边也可以直接把这份 JSON 塞进环境变量 zeekr_val / ZEEKR_VAL。
#      Token 自动存进客户端（键名 zeekr_val），定时任务不用填 Token。
#   B. 手动填 Token：把每条 cron 参数里的 <把这里换成你的Bearer Token> 替换成真 Token。
#      QX 的 # 参数不会发到服务器，Loon/Stash/Egern 的 argument/env 也只在本机。
#      ⚠️ 千万别把 Token 写进公开托管的脚本文件里！
#
# 场次安排（与 Hermes 里那套 systemd 三场一致，脚本默认「快跑 + 10 分钟后补领」）：
#   00:01 全流程    00:10 只领取（补延迟入账的碎片/能量球）
#   08:10 全流程    08:20 只领取
#   21:30 全流程    21:40 只领取
# 客户端超时可以放宽的话，可以只用 3 条 cron + POLL=1（脚本自己轮询到领完，
# 单次约 3~5 分钟，需要 timeout ≥ 420）。
# ══════════════════════════════════════════════════════════════════════

[mitm]
hostname = api-gw-toc.zeekrlife.com

[rewrite_local]
# 自动抓 Token：极氪 App 任何一条走该域名的请求都会把 Authorization 存进 QX
^https:\/\/api-gw-toc\.zeekrlife\.com\/zeekrlife-app-user/v\d/user/info/query$ url script-request-header https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js
# 若抓不到（该接口没触发），把上面那行换成整域名匹配（开销略大但更稳）：
# ^https:\/\/api-gw-toc\.zeekrlife\.com\/ url script-request-header https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js

[task_local]
# 凌晨场
1 0 * * * https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js#ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=凌晨场, tag=极氪签到·凌晨场, enabled=true
10 0 * * * https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js#MODE=claim&TAG=凌晨场·补领, tag=极氪签到·凌晨补领, enabled=true
# 早间场
10 8 * * * https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js#ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=早间场, tag=极氪签到·早间场, enabled=true
20 8 * * * https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js#MODE=claim&TAG=早间场·补领, tag=极氪签到·早间补领, enabled=true
# 晚间场
30 21 * * * https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js#ZEEKR_TOKEN=<把这里换成你的Bearer Token>&TAG=晚间场, tag=极氪签到·晚间场, enabled=true
40 21 * * * https://raw.githubusercontent.com/m20104600/zeekr-checkin/main/dist/zeekr.js#MODE=claim&TAG=晚间场·补领, tag=极氪签到·晚间补领, enabled=true

# 说明：
# * QX 的 cron 是 5 段：分 时 日 月 周（用北京时间/设备本地时间）。
# * QX 脚本执行上限约 30 秒，所以用「快跑 + 补领」而不是 POLL=1。
# * 抓取规则只需要「打开极氪 App 点一下」时生效一次，之后可以把
#   [rewrite_local] 那条注释掉（但留着也不影响，Token 变了会自动更新）。
# * 若抓取规则已抓到 Token，上面每条 cron 的 ZEEKR_TOKEN= 参数可以整段删掉。
